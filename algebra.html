<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

</style>
<body>
    <canvas id="canvas" height="500" width="500" style="border: 1px solid black;"></canvas>
    <input id= "range" type="range" min="0" max="360" placeholder="slamano" >
    <span id="angulo"></span>
    <input id= "X" type="number" placeholder="slamano3" >
    <input id= "Y" type="number" placeholder="slamano4" >
    <button title="slamano2" id="butao"></button>
    <input type="checkbox" id="espelhar" title="espelhar">
    <script type="module">
        import {create, all} from "https://cdn.jsdelivr.net/npm/mathjs@14/+esm";
        let canva = document.getElementById("canvas")
        let range = document.getElementById("range")
        let butao = document.getElementById("butao")
        let espelhar = document.getElementById("espelhar")
        let girar = document.getElementById("girar")
        let velocidade = document.getElementById("velocidadeRotacao")
        let inputX = document.getElementById("X")
        let inputY = document.getElementById("Y")
        let angulo = 1
        let ctx = canva.getContext("2d")
        let matematica = create(all)
        let X = canva.width/2
        let Y = canva.height/2

            

        function rotacionar(tethaGraus){
            let tethaRad = tethaGraus * (Math.PI/180)
            let matrizRotacao = [
            [Math.cos(tethaRad), -(Math.sin(tethaRad))],
            [Math.sin(tethaRad), Math.cos(tethaRad)]
        ]
            let vetor = [[X],[Y]]
            let resultado = matematica.multiply(matrizRotacao, vetor).valueOf()
        

            



            desenhar(resultado[0][0], resultado[1][0])

            return resultado
        }

        function desenhar(X, Y){
            ctx.clearRect(0,0, canva.width, canva.height)
            let canvasX = canva.width/2 + X
            let canvasY = canva.height/2 - Y
            ctx.beginPath()
            ctx.moveTo(canva.width/2, 0)
            ctx.lineTo(canva.width/2, 500)
            ctx.stroke()

            ctx.beginPath()
            ctx.moveTo(0, canva.height/2)
            ctx.lineTo(500, canva.height/2)
            ctx.stroke()
            ctx.beginPath()
            ctx.arc(canvasX, canvasY, 5, 0, Math.PI*2)
            ctx.fillStyle = "red"
            ctx.fill()
            if(espelhar.checked){
            ctx.beginPath()
            ctx.arc((canvas.width/2 - X), (canvas.height/2 + Y), 5, 0, Math.PI*2)
            ctx.fillStyle = "blue"
            ctx.fill()
            ctx.stroke()
        }
            else{
                ctx.stroke()
            }
        }

        butao.addEventListener("click", () => {
            X = Number(inputX.value)
            Y = Number(inputY.value)
            desenhar(X,Y)
        })

        range.addEventListener("input", () => {
            X = Number(inputX.value)
            Y = Number(inputY.value)
            rotacionar(Number(range.value))
            
            document.getElementById("angulo").innerHTML=  Number(range.value)
        })

        
      
            
       
       
    </script>
</body>
</html>
